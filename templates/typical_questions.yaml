# Типовые уточняющие вопросы по видам работ (FR-A-08).
# generic задаются, если по конкретному виду работ не хватило вопросов.
# Ключи соответствуют work_type из structured_fields (в нижнем регистре).
# options — варианты ответа; пользователь может выбрать или ввести свой (FR-DLG-02).

generic:
  - text: "Есть ли ограничения по времени выполнения работ?"
    hint: "Например, только днём, только в выходные, нельзя шуметь"
    options: ["нет ограничений", "только днём", "только в выходные", "другое"]

  - text: "Нужен ли вывоз строительного мусора?"
    options: ["да, включить в работы", "нет, вывезем сами", "не знаю"]

  - text: "Нужна ли гарантия на выполненные работы?"
    hint: "Обычно от 1 до 3 лет"
    options: ["1 год", "2 года", "3 года", "не требуется", "не знаю"]

кровля:
  - text: "Какая площадь кровли?"
    hint: "Примерно, в квадратных метрах"
    options: ["до 50 кв.м", "50-100 кв.м", "100-500 кв.м", "более 500 кв.м", "не знаю"]

  - text: "Какой тип кровли?"
    options: ["мягкая наплавляемая", "фальцевая", "черепица", "шифер", "плоская", "не знаю"]

  - text: "Что именно произошло?"
    options: ["протечка", "вздутие покрытия", "разрушение", "полная замена", "другое"]

  - text: "На какой высоте находится кровля?"
    hint: "От земли до карниза, в метрах"
    options: ["до 5 м", "5-10 м", "10-20 м", "более 20 м", "не знаю"]

  - text: "Есть ли доступ к кровле?"
    options: ["свободный", "через люк", "по пожарной лестнице", "нет доступа", "не знаю"]

фасад:
  - text: "Какая площадь фасада?"
    options: ["до 100 кв.м", "100-500 кв.м", "500-1000 кв.м", "более 1000 кв.м", "не знаю"]

  - text: "Какой материал фасада?"
    options: ["штукатурка", "кирпич", "сайдинг", "вентилируемый фасад", "другое", "не знаю"]

  - text: "Что нужно сделать?"
    options: ["утепление", "покраска", "ремонт швов", "замена облицовки", "другое"]

  - text: "На какой высоте будут работы?"
    options: ["до 5 м", "5-15 м", "15-30 м", "более 30 м", "не знаю"]

плитка:
  - text: "Где нужно уложить плитку?"
    options: ["пол", "стены", "крыльцо", "санузел", "другое"]

  - text: "Какая площадь укладки?"
    options: ["до 10 кв.м", "10-50 кв.м", "50-200 кв.м", "более 200 кв.м", "не знаю"]

  - text: "Нужен ли демонтаж старой плитки?"
    options: ["да", "нет", "частично", "не знаю"]

  - text: "Есть ли уже плитка или её нужно закупать?"
    options: ["плитка есть", "нужно закупить", "закупит подрядчик", "не знаю"]

доводчик:
  - text: "Сколько доводчиков нужно установить или заменить?"
    options: ["1", "2-5", "6-10", "более 10", "не знаю"]

  - text: "На какие двери?"
    options: ["входные", "межкомнатные", "пожарные", "другое"]

  - text: "Что именно не работает?"
    options: ["не закрывается", "хлопает", "течёт масло", "полностью сломан", "другое"]

протечка:
  - text: "Где обнаружена протечка?"
    options: ["кровля", "стена", "подвал", "паркинг", "трубы", "другое"]

  - text: "Какова площадь повреждения?"
    options: ["до 1 кв.м", "1-10 кв.м", "10-50 кв.м", "более 50 кв.м", "не знаю"]

  - text: "Есть ли угроза затопления соседей или имущества?"
    options: ["да, срочно", "пока нет", "уже произошло", "не знаю"]

  - text: "Нужен ли срочный выезд или можно планово?"
    options: ["срочно, сегодня", "в течение недели", "планово", "не знаю"]

замена окна:
  - text: "Сколько окон нужно заменить?"
    options: ["1", "2-5", "6-10", "более 10", "не знаю"]

  - text: "Какие размеры окон?"
    hint: "Ширина × высота в сантиметрах, примерно"
    options: ["стандартные", "нестандартные", "разные", "не знаю"]

  - text: "Какой тип окна нужен?"
    options: ["пластиковое", "деревянное", "алюминиевое", "не знаю"]

  - text: "Нужен ли демонтаж старых окон?"
    options: ["да, с вывозом", "да, без вывоза", "нет", "не знаю"]